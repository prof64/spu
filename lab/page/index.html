<title>SPU Format Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap">
<style>
/* One dark look on purpose: the page is a viewing room and the stage is the only bright thing in it.
   A row of tabs names what the format does; each tab sets up the stage and explains itself beside it. */
:root {
  color-scheme: dark;
  --room: #0f1117; --panel: #171a23; --raised: #1f2330; --line: #2c3140;
  --text: #e8e4da; --dim: #9b9aa5; --lamp: #ffb357; --cold: #86d3e6;
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
body { background: var(--room); color: var(--text); font: 15px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: grid; gap: 6px; }
h1 { font: 600 30px/1.1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--lamp); }
.lede { margin: 0; color: var(--dim); max-width: 70ch; }
h2 { font: 600 17px/1.25 var(--body); margin: 0; text-wrap: balance; }
h3 { font: 600 14px/1.3 var(--body); margin: 4px 0 0; }
button { font: 500 13px/1 var(--body); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cold); outline-offset: 2px; }
#tabs { display: flex; flex-wrap: wrap; gap: 6px; }
#tabs button { color: var(--dim); background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; }
#tabs button:hover { color: var(--text); }
#tabs button[aria-pressed="true"] { background: var(--lamp); border-color: var(--lamp); color: var(--room); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stagecol { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; border: 1px solid var(--line); background: #000; line-height: 0; }
#view { width: 100%; aspect-ratio: 3 / 2; display: block; touch-action: none; cursor: crosshair; max-width: 100%; }
#hint { position: absolute; left: 12px; bottom: 12px; font: 500 13px/1 var(--body); color: var(--room); background: var(--lamp); padding: 7px 10px; pointer-events: none; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; line-height: 1.5; color: var(--text); background: var(--panel); }
#sprites { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
#sprites button { display: grid; justify-items: center; gap: 4px; padding: 8px 4px 7px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 12px; cursor: pointer; }
#sprites img { height: 44px; width: auto; max-width: 76px; object-fit: contain; image-rendering: pixelated; }
#sprites button[aria-pressed="true"], #balls button[aria-pressed="true"], #map button[aria-pressed="true"] { border-color: var(--lamp); color: var(--text); background: var(--raised); }
#panel { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: grid; gap: 12px; min-width: 0; align-content: start; }
#panel p, #wide p { margin: 0; color: var(--dim); font-size: 14px; max-width: 62ch; }
#panel b, #wide b { color: var(--text); font-weight: 600; }
#panel p.small { font-size: 13px; } #panel p.hint { color: var(--lamp); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); justify-self: start; max-width: 100%; }
.seg.wrapping { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); justify-self: stretch; }
.seg button, .tog { color: var(--dim); background: var(--room); border: 0; padding: 9px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg.wrapping button { border: 0; box-shadow: 0 0 0 .5px var(--line); }
.tog { border: 1px solid var(--line); }
.seg button:hover, .tog:hover { color: var(--text); }
.seg button[aria-pressed="true"], .tog[aria-pressed="true"] { background: var(--lamp); color: var(--room); }
.seg button:disabled, .tog:disabled { opacity: .4; cursor: default; }
.slide { display: grid; gap: 6px; font-size: 13px; color: var(--text); }
input[type=range] { width: 100%; min-width: 0; margin: 0; accent-color: var(--lamp); }
.legend, .facts, #mats { list-style: none; margin: 0; padding: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; }
.facts { display: grid; gap: 6px; color: var(--dim); font-size: 14px; }
#mats { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
#mats li { display: grid; grid-template-columns: 18px auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 10px; background: var(--room); }
.num { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.shades { display: inline-flex; } .shades i { width: 9px; height: 22px; display: block; }
.what { display: grid; min-width: 0; } .what b { font-size: 13px; } .what span { color: var(--dim); font-size: 12px; }
#mats li.val { grid-template-columns: 96px minmax(0, 1fr) 28px; font-size: 13px; }
#mats li.dial { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
#mats li.dial input, .ends { grid-column: 1 / -1; }
.ends { position: relative; height: 15px; color: var(--dim); font-size: 11px; }
.ends i { font-style: normal; position: absolute; top: 0; white-space: nowrap; }
#mats li.note { display: block; color: var(--dim); font-size: 12px; }
.n { color: var(--dim); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
#wide { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 20px; }
#wide h2.sub { margin-top: 14px; }
#map { display: grid; grid-template-columns: auto repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 6px; max-width: 760px; align-items: center; }
#map .col, #map .row { font: 500 11px/1.2 var(--body); color: var(--dim); letter-spacing: .03em; display: block; }
#map .col { text-align: center; overflow-wrap: anywhere; } #map .row { padding-right: 6px; }
#map button { padding: 3px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; line-height: 0; min-width: 0; }
#map img { width: 100%; height: auto; image-rendering: pixelated; }
#balls { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 6px; }
#balls button { display: grid; justify-items: center; gap: 2px; padding: 4px 4px 7px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 12px; line-height: 1.15; cursor: pointer; }
#balls img { width: 88px; height: 88px; image-rendering: pixelated; }
.sheets { display: grid; gap: 14px; margin-top: 6px; }
.sheets figure { margin: 0; display: grid; gap: 6px; }
.sheets canvas { width: 100%; max-width: 768px; image-rendering: pixelated; background: #000; border: 1px solid var(--line); }
.sheets figcaption { color: var(--dim); font-size: 13px; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 25px; } }
</style>
<div class="wrap">
  <header>
    <h1>SPU <em>Format</em> Lab</h1>
    <p class="lede">SPU is one small file per sprite: parts that move, alternate looks, and how every pixel takes light. Sixteen sprites stand in as test subjects, from Black 2 and White 2 and from Uranium. Pick a tab to see one thing the format does.</p>
  </header>
  <nav id="tabs" aria-label="What the format does"></nav>
  <div class="main">
    <div class="stagecol">
      <div class="stage">
        <canvas id="view" aria-label="The chosen sprite on the stage"></canvas>
        <div id="hint">Move the light</div>
        <div id="fail" hidden></div>
      </div>
      <div id="sprites"></div>
    </div>
    <aside id="panel"></aside>
  </div>
  <section id="wide" hidden></section>
</div>
