[package]
name = "spu"
version = "0.2.0"
edition = "2024"
publish = false
description = "SPU (Sprite Universal): a file format for animated 2D sprites. The reference library and the `spu` command."

[dependencies]
anyhow = "1"
png = "0.17"
miniz_oxide = "0.8"
image = { version = "0.24.9", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "spu"
path = "src/bin/spu.rs"

[[bin]]
name = "make-conformance"
path = "src/bin/make_conformance.rs"
