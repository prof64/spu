# Cross-checks the reference renderer against Smeargle's own renderer on
# real version 0 files. Kept outside the main package because it needs a
# Smeargle checkout beside this repository (see README "Corpus check").
[package]
name = "corpus-check"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
sprite-lab = { path = "../.." }
smeargle-core = { path = "../../../pk-mono/smeargle/crates/smeargle-core", default-features = false }

[profile.release]
debug-assertions = false
